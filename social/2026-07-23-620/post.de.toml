body = "Die Palette bietet jetzt eine Auswahl an vordefinierten Farben und ermöglicht es dir, eine ganz individuelle Farbpalette zusammenzustellen."
media = "Colors for bookmarks and tracks.jpg"
device = "iphone"
theme = "blue"

[[slides]]
type = "feature"
eyebrow = "iOS · Lesezeichen"
