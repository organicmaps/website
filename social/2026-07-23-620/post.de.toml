title = "Juli-Update"
subtitle = "Diesen Monat haben wir uns auf die Suche nach Fehlern gemacht. Öffentliche Verkehrsmittel, Route, Suche und Lesezeichen – all das wurde noch besser."

[[slides]]
type = "feature"
eyebrow = "Routing"
title = "Warnungen auf jeder Route"
body = "Mautstellen, Fähren, unbefestigte Straßen und Stufen werden jetzt auch auf den alternativen Routen markiert, nicht nur auf der ersten."
