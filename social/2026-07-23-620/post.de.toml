body = "Mit der neuen Schaltfläche „Bearbeiten“ kannst du Lesezeichen schnell entfernen, und deine Änderungen werden automatisch gespeichert, sobald du den Bildschirm verlässt."
media = "Mass bookmarks and tracks editing.jpg"
device = "iphone"
theme = "green"

