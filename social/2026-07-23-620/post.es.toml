device = "desktop"
theme = "green"

[[slides]]
type = "feature"
eyebrow = "iOS · Marcadores"
title = "Elige cualquier color"
body = "La paleta ahora ofrece un conjunto de colores predefinidos y te permite crear uno totalmente personalizado."
media = "Colors for bookmarks and tracks.jpg"
device = "iphone"
theme = "blue"

[[slides]]
type = "feature"
eyebrow = "iOS · Marcadores"
title = "Pon en orden tus listas"
body = "Un nuevo botón «Editar» te permite eliminar marcadores rápidamente, y los cambios se guardan automáticamente al salir de la pantalla."
media = "Mass bookmarks and tracks editing.jpg"
device = "iphone"
theme = "green"

[[slides]]
type = "list"
eyebrow = "Android"
title = "Un día a día más tranquilo"
items = [
    "El horario muestra los turnos divididos y toda la semana de una sola vez",
    "Una barra de búsqueda más sencilla con un botón combinado para borrar y para la función de voz",
    "Editor de marcadores y tracks renovado",
    "Se han solucionado los problemas con la planificación de rutas, y el selector de colores se cierra solo",
]
