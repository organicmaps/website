title = "Actualización de julio"
subtitle = "Este mes nos hemos dedicado a buscar errores. El transporte público, las rutas, la búsqueda y los marcadores han mejorado bastante."

[[slides]]
type = "feature"
eyebrow = "Enrutamiento"
title = "Advertencias en todas las rutas"
body = "Ahora también se indican los peajes, los transbordadores, las carreteras sin asfaltar y los escalones en las rutas alternativas, no solo en la primera."
