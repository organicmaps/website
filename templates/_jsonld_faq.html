{# One published question per article; its H2 subtopics remain part of the answer. #}
{%- set term_url = get_taxonomy_url(kind="faq", term=current_category, lang=lang) -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [{
    "@type": "Question",
    "name": {{ page.title | json_encode | safe }},
    "acceptedAnswer": {
      "@type": "Answer",
      "text": {{ page.content | json_encode | replace(from="</", to="<\/") | safe }}
    }
  }]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": {{ faq_label | json_encode | safe }},
      "item": {{ faq_root.permalink | json_encode | safe }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ faq_category_title | json_encode | safe }},
      "item": {{ term_url | json_encode | safe }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | json_encode | safe }}
    }
  ]
}
</script>
