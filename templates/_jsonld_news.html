{# NewsArticle structured data for individual news posts.
   Required by Google for Top Stories / Discover eligibility. -#}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": {{ page.title | json_encode | safe }},
  "datePublished": {{ page.date | date(format="%Y-%m-%dT%H:%M:%S%:z") | json_encode | safe }},
  {%- if page.updated %}
  "dateModified": {{ page.updated | date(format="%Y-%m-%dT%H:%M:%S%:z") | json_encode | safe }},
  {%- else %}
  "dateModified": {{ page.date | date(format="%Y-%m-%dT%H:%M:%S%:z") | json_encode | safe }},
  {%- endif %}
  {%- if has_article_image %}
  {#- preview_image is already an absolute URL, resolved in base.html. #}
  "image": [{{ preview_image | json_encode | safe }}],
  {%- endif %}
  "author": {
    "@type": "Organization",
    "name": "Organic Maps",
    "url": "{{ config.base_url | safe }}/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Organic Maps",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ config.base_url | safe }}/logos/green-on-white.svg"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ current_url | json_encode | safe }}
  }{% if page.description %},
  "description": {{ page.description | json_encode | safe }}{% endif %}
}
</script>
