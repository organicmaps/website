<script>
(function () {
// Supports partially translated pages. Redirect only when there has been no earlier automatic
// redirect or explicit choice (see language_selector.html).
if (window.localStorage.getItem('lang') === null) {
  // Map of language codes to their actual URLs (handles different slugs per language)
  var pageTranslations = {
    {%- if resource.translations %}
    {% for translation in resource.translations -%}
    "{{ translation.lang }}": "{{ translation.permalink  | replace(from=config.base_url, to="") | safe }}",
    {% endfor -%}
    {%- elif term_translation_langs is defined and term_translation_langs | length > 0 -%}
    {% for i in range(end=term_translation_langs | length) -%}
    "{{ term_translation_langs[i] }}": "{{ term_translation_urls[i] | replace(from=config.base_url, to="") | safe }}",
    {% endfor -%}
    {%- endif %}
  };
  var userPreferredLanguages = navigator.languages ? navigator.languages : [navigator.language];
  var redirected = false;

  // Prefer the complete browser tag before falling back to its primary language. This preserves
  // regional variants such as pt-BR independently of the generated object's key order.
  function availableLanguage(preferred) {
    var tag = String(preferred || '').replace(/_/g, '-').toLowerCase();
    var primary = tag.split('-')[0];
    var langCode;

    for (langCode in pageTranslations) {
      if (pageTranslations.hasOwnProperty(langCode) && langCode.toLowerCase() === tag) return langCode;
    }
    if (pageTranslations.hasOwnProperty(primary)) return primary;
    for (langCode in pageTranslations) {
      if (pageTranslations.hasOwnProperty(langCode) && langCode.toLowerCase().split('-')[0] === primary) {
        return langCode;
      }
    }
    return null;
  }

  for (var i = 0; i < userPreferredLanguages.length && !redirected; i++) {
    var langCode = availableLanguage(userPreferredLanguages[i]);
    if (langCode !== null) {
      window.localStorage.setItem('lang', langCode);
      // Do not redirect the default 'en' language.
      if (langCode !== '{{ config.default_language }}') {
        // Carry the query string and fragment across: a link into a specific section
        // (#install, #crypto) or a page prefilled from its parameters (the donation
        // form's ?amount=&interval=) must survive the language redirect intact.
        window.location.href = pageTranslations[langCode] + window.location.search + window.location.hash;
      }
      redirected = true;
    }
  }
}
})();
</script>
